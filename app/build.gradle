plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.tacosolmedo.repartidor'
    compileSdk 34

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            def ksAlias = System.getenv("KEYSTORE_ALIAS")
            def ksPass = System.getenv("KEYSTORE_PASSWORD")
            def kPass = System.getenv("KEY_PASSWORD")
            if (ksPath != null && ksAlias != null) {
                storeFile file(ksPath)
                keyAlias ksAlias
                storePassword ksPass
                keyPassword kPass
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    defaultConfig {
        applicationId "com.tacosolmedo.repartidor"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    // Evita fallos con recursos de AndroidX no usados
    lintOptions {
        abortOnError false
    }
}

dependencies {
    // Sin librerías externas: WebView es del sistema. Compilación ligera.
}
