name: Build Repartidor APK (signed)

on:
  workflow_dispatch:
  push:
    branches: [apk.de.repartidor]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate upload keystore
        run: |
          mkdir -p $GITHUB_WORKSPACE/keystore
          keytool -genkeypair \
            -v -keystore $GITHUB_WORKSPACE/keystore/repartidor.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEYSTORE_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Tacos Olmedo, OU=Repartidor, O=TacosOlmedo, L=El Grullo, ST=Jalisco, C=MX"
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build signed APK + AAB (Play)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
          arguments: assembleRelease bundleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/repartidor.jks
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: repartidor-apk-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload signed AAB (Google Play) artifact
        uses: actions/upload-artifact@v4
        with:
          name: repartidor-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Verify signing
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          AAB=$(ls app/build/outputs/bundle/release/*.aab)
          echo "=== apksigner verify (APK) ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs -v "$APK" || true
          echo "=== jarsigner verify (AAB) ==="
          jarsigner -verify -verbose -certs "$AAB" || true
